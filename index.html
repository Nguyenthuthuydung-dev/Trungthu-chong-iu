<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trung thu của chúng mình 🌙</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02010a;
    font-family:Arial, sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#text{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
    color:white;
    font-size:clamp(24px,6vw,52px);
    font-weight:700;
    line-height:1.45;
    text-shadow:
        0 0 8px #fff,
        0 0 20px #c77dff,
        0 0 40px #7b2cff;
    opacity:0;
    transition:opacity 1.5s ease;
    z-index:5;
}

#start{
    position:fixed;
    z-index:10;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    padding:15px 28px;
    border:1px solid rgba(255,255,255,.7);
    border-radius:999px;
    background:rgba(255,255,255,.08);
    color:white;
    font-size:18px;
    backdrop-filter:blur(10px);
    box-shadow:0 0 30px rgba(180,100,255,.5);
}

#hint{
    position:fixed;
    bottom:25px;
    width:100%;
    text-align:center;
    color:rgba(255,255,255,.55);
    font-size:13px;
    z-index:6;
}
</style>
</head>

<body>

<canvas id="space"></canvas>

<div id="text"></div>

<button id="start">🌙 Bắt đầu</button>

<div id="hint">Chạm vào màn hình để bắt đầu hành trình ✨</div>

<script>

const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");
const text = document.getElementById("text");
const start = document.getElementById("start");
const hint = document.getElementById("hint");

let W,H;
let particles=[];
let heartParticles=[];

let started=false;
let heartMode=false;

const isMobile = innerWidth < 600;

/* NHIỀU HẠT VŨ TRỤ */
const PARTICLE_COUNT = isMobile ? 2800 : 5000;

function resize(){
    W=canvas.width=innerWidth;
    H=canvas.height=innerHeight;
}

resize();
addEventListener("resize",resize);


/* TẠO HẠT */
function createParticles(){

    particles=[];

    for(let i=0;i<PARTICLE_COUNT;i++){

        particles.push({

            x:Math.random()*W,
            y:Math.random()*H,

            vx:(Math.random()-.5)*0.45,
            vy:(Math.random()-.5)*0.45,

            size:Math.random()*1.8+.25,

            hue:Math.random()*360,

            alpha:Math.random()*.8+.2,

            twinkle:Math.random()*Math.PI*2,

            depth:Math.random()
        });
    }
}

createParticles();


/* HÌNH TRÁI TIM */
function createHeart(){

    heartParticles=[];

    /*
       Phương trình trái tim:
       x = 16 sin³(t)
       y = 13 cos(t)-5cos(2t)-2cos(3t)-cos(4t)
    */

    for(let i=0;i<PARTICLE_COUNT;i++){

        let t=Math.random()*Math.PI*2;

        let r=Math.sqrt(Math.random());

        let x=
            16*Math.pow(Math.sin(t),3);

        let y=
            13*Math.cos(t)
            -5*Math.cos(2*t)
            -2*Math.cos(3*t)
            -Math.cos(4*t);

        x*=r;
        y*=r;

        const scale=Math.min(W,H)/36;

        heartParticles.push({

            x:W/2 + x*scale,
            y:H/2 - y*scale,

            hue:Math.random()*360,

            size:Math.random()*2+.5,

            alpha:Math.random()*.9+.1
        });
    }
}

createHeart();


/* VẼ */
function draw(){

    ctx.fillStyle="rgba(2,1,10,0.22)";
    ctx.fillRect(0,0,W,H);

    const source = heartMode ? heartParticles : particles;

    source.forEach((p,i)=>{

        if(!heartMode){

            p.x+=p.vx;
            p.y+=p.vy;

            p.twinkle+=0.03;

            if(p.x<0)p.x=W;
            if(p.x>W)p.x=0;

            if(p.y<0)p.y=H;
            if(p.y>H)p.y=0;

            p.hue+=0.25;

            const glow =
                p.alpha*
                (.55+.45*Math.sin(p.twinkle));

            ctx.beginPath();

            ctx.fillStyle=
                `hsla(${p.hue},100%,70%,${glow})`;

            ctx.shadowBlur=8;
            ctx.shadowColor=
                `hsla(${p.hue},100%,65%,.8)`;

            ctx.arc(
                p.x,
                p.y,
                p.size,
                0,
                Math.PI*2
            );

            ctx.fill();

        }else{

            /* HẠT TRÁI TIM ĐỔI MÀU */

            p.hue+=0.4;

            const pulse=
                1+
                Math.sin(Date.now()/500+i)*0.15;

            ctx.beginPath();

            ctx.fillStyle=
                `hsla(${p.hue},100%,70%,${p.alpha})`;

            ctx.shadowBlur=12;

            ctx.shadowColor=
                `hsla(${p.hue},100%,65%,1)`;

            ctx.arc(
                p.x,
                p.y,
                p.size*pulse,
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    });

    ctx.shadowBlur=0;

    requestAnimationFrame(draw);
}

draw();


/* HIỆU ỨNG CHỮ */

const messages=[

    "🌙 Chúc Bảo Lâm thương mến của Thùy Dung Trung thu này 🌙",

    "Luôn luôn vui vẻ ✨",

    "Luôn luôn khỏe mạnh 💙",

    "Hạnh phúc nhóoo 💗",

    "Em xin lỗi và cảm ơn anh iu vì tất cả ❤️",

    "Ở lại và đồng hành cùng em đến hết đời nhée 🥺❤️"

];

let messageIndex=0;


function showMessage(message,duration=3500){

    return new Promise(resolve=>{

        text.style.opacity=0;

        setTimeout(()=>{

            text.innerHTML=message;

            text.style.opacity=1;

            setTimeout(()=>{

                text.style.opacity=0;

                setTimeout(resolve,1200);

            },duration);

        },1200);
    });
}


/* BẮT ĐẦU */

async function startJourney(){

    if(started)return;

    started=true;

    start.style.display="none";
    hint.style.display="none";

    await new Promise(r=>setTimeout(r,1000));


    /* HIỆN TỪNG CÂU */

    for(let i=0;i<messages.length;i++){

        await showMessage(
            messages[i],
            i===0 ? 4200 : 3200
        );
    }


    /* CHUYỂN SANG TRÁI TIM */

    text.innerHTML="❤️";

    text.style.fontSize="70px";
    text.style.opacity=1;

    setTimeout(()=>{

        text.style.opacity=0;

        /* Bắt đầu gom hạt */
        heartMode=true;

        setTimeout(()=>{

            text.innerHTML=
                "❤️<br>Thương anh nhiều lắm, Bảo Lâm";

            text.style.fontSize=
                "clamp(24px,6vw,48px)";

            text.style.opacity=1;

        },5000);

    },2200);
}


/* NÚT */

start.addEventListener("click",startJourney);


/* CHẠM MÀN HÌNH */

document.body.addEventListener("click",(e)=>{

    if(!started &&
       e.target!==start){

        startJourney();
    }

});

</script>

</body>
</html>
