<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trung thu của chúng mình ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#00030b;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

.text{
    position:fixed;
    z-index:5;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:90%;
    text-align:center;
    color:white;
    font-size:clamp(20px,5vw,34px);
    font-weight:bold;
    line-height:1.4;
    text-shadow:
        0 0 8px white,
        0 0 20px #ff1744,
        0 0 40px #2196ff;
    opacity:0;
    transition:opacity 1.2s ease;
    pointer-events:none;
}

.text.show{
    opacity:1;
}

.heartText{
    position:fixed;
    z-index:6;
    left:50%;
    top:78%;
    transform:translateX(-50%);
    width:95%;
    text-align:center;
    color:white;
    font-size:clamp(22px,6vw,38px);
    font-weight:bold;
    opacity:0;
    text-shadow:
        0 0 8px #ff1744,
        0 0 20px #ff1744,
        0 0 40px #ff1744;
    transition:opacity 2s ease;
}

.heartText.show{
    opacity:1;
}

.start{
    position:fixed;
    z-index:10;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    padding:15px 30px;
    border:1px solid rgba(255,255,255,.6);
    border-radius:30px;
    background:rgba(0,0,0,.4);
    color:white;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 0 25px rgba(255,255,255,.4);
    transition:opacity 1s;
}

.start.hide{
    opacity:0;
    pointer-events:none;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<button class="start" id="start">
    Bắt đầu hành trình ✨
</button>

<div class="text" id="text"></div>

<div class="heartText" id="heartText">
    Thương anh nhiều lắm, Bảo Lâm
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

canvas.width = W;
canvas.height = H;

const colors = [
    "#2196ff",
    "#ff1744",
    "#ffd600"
];

const COUNT = 1100;

let particles = [];
let heartParticles = [];

let started = false;
let formingHeart = false;

const messages = [
    "Chúc Bảo Lâm thương mến của Thùy Dung trung thu này",
    "Luôn luôn vui vẻ",
    "Luôn luôn khỏe mạnh",
    "Hạnh phúc nhóoo",
    "Em xin lỗi và cảm ơn anh iu vì tất cả",
    "Ở lại và đồng hành cùng em đến hết đời nhée"
];

let messageIndex = 0;

function random(min,max){
    return Math.random()*(max-min)+min;
}

function createParticles(){

    particles=[];

    for(let i=0;i<COUNT;i++){

        particles.push({

            x:random(0,W),
            y:random(0,H),

            vx:random(-0.35,0.35),
            vy:random(-0.35,0.35),

            size:random(.7,2.5),

            color:
                colors[
                    Math.floor(
                        Math.random()*colors.length
                    )
                ],

            alpha:random(.35,1)

        });
    }
}

function createHeart(){

    heartParticles=[];

    const scale=Math.min(W,H)/38;

    for(let i=0;i<COUNT;i++){

        const t=
            Math.random()*Math.PI*2;

        const fill=
            Math.sqrt(Math.random());

        const x=
            16*Math.pow(Math.sin(t),3);

        const y=
            13*Math.cos(t)
            -5*Math.cos(2*t)
            -2*Math.cos(3*t)
            -Math.cos(4*t);

        heartParticles.push({

            x:W/2+x*scale*fill,

            y:H/2-y*scale*fill,

            size:random(.8,2.5)

        });
    }
}

createParticles();
createHeart();

window.addEventListener("resize",()=>{

    W=innerWidth;
    H=innerHeight;

    canvas.width=W;
    canvas.height=H;

    createHeart();

});

function drawParticle(p){

    ctx.beginPath();

    ctx.fillStyle=p.color;
    ctx.globalAlpha=p.alpha;

    ctx.shadowBlur=12;
    ctx.shadowColor=p.color;

    ctx.arc(
        p.x,
        p.y,
        p.size,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.globalAlpha=1;
    ctx.shadowBlur=0;
}

function animate(){

    requestAnimationFrame(animate);

    ctx.fillStyle="rgba(0,3,11,0.16)";
    ctx.fillRect(0,0,W,H);

    particles.forEach((p,i)=>{

        if(!formingHeart){

            p.x+=p.vx;
            p.y+=p.vy;

            if(p.x<0)p.x=W;
            if(p.x>W)p.x=0;

            if(p.y<0)p.y=H;
            if(p.y>H)p.y=0;

        }else{

            const target=heartParticles[i];

            p.x+=(target.x-p.x)*0.025;
            p.y+=(target.y-p.y)*0.025;

            p.size+=(target.size-p.size)*0.025;

            p.color="#ff1744";
            p.alpha=1;

        }

        drawParticle(p);
    });
}

animate();

const start=
    document.getElementById("start");

const text=
    document.getElementById("text");

const heartText=
    document.getElementById("heartText");

start.addEventListener(
    "click",
    startJourney
);

function startJourney(){

    if(started)return;

    started=true;

    start.classList.add("hide");

    /*
       Hiện từng câu một
    */

    showNextMessage();
}

function showNextMessage(){

    if(messageIndex >= messages.length){

        /*
           Sau câu thứ 6:
           bắt đầu gom hạt thành trái tim
        */

        text.classList.remove("show");

        setTimeout(()=>{

            formingHeart=true;

            /*
               Đợi trái tim hình thành
            */

            setTimeout(()=>{

                heartText.classList.add("show");

            },4500);

        },1200);

        return;
    }

    text.textContent=
        messages[messageIndex];

    text.classList.add("show");

    /*
       Mỗi câu xuất hiện 3 giây
    */

    setTimeout(()=>{

        text.classList.remove("show");

        setTimeout(()=>{

            messageIndex++;

            showNextMessage();

        },1000);

    },3000);
}

document.body.addEventListener(
    "click",
    function(e){

        if(
            !started &&
            e.target !== start
        ){

            startJourney();

        }

    }
);
</script>

</body>
</html>
