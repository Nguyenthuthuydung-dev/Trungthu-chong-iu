<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trung thu của chúng mình ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#00030b;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

.start{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:10;
    padding:15px 30px;
    border:1px solid rgba(255,255,255,.5);
    border-radius:30px;
    background:rgba(0,0,0,.35);
    color:white;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 0 25px rgba(255,255,255,.4);
    transition:1s;
}

.start.hide{
    opacity:0;
    pointer-events:none;
}

.message{
    position:fixed;
    z-index:5;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:90%;
    text-align:center;
    color:white;
    opacity:0;
    transition:2s;
    pointer-events:none;
    text-shadow:
        0 0 8px #ff1744,
        0 0 20px #ff1744,
        0 0 40px #ff1744;
}

.message.show{
    opacity:1;
}

.message p{
    margin:9px 0;
    font-size:clamp(17px,4.5vw,28px);
    line-height:1.35;
}

.message p:last-child{
    margin-top:20px;
    font-size:clamp(22px,6vw,38px);
    font-weight:bold;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<button class="start" id="start">
    Bắt đầu hành trình ✨
</button>

<div class="message" id="message">
    <p>Chúc Bảo Lâm thương mến của Thùy Dung trung thu này</p>
    <p>Luôn luôn vui vẻ</p>
    <p>Luôn luôn khỏe mạnh</p>
    <p>Hạnh phúc nhóoo</p>
    <p>Em xin lỗi và cảm ơn anh iu vì tất cả</p>
    <p>Ở lại và đồng hành cùng em đến hết đời nhée</p>
    <p>Thương anh nhiều lắm, Bảo Lâm</p>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

canvas.width = W;
canvas.height = H;

const colors = [
    "#2196ff",
    "#ff1744",
    "#ffd600"
];

const COUNT = 900;

let particles = [];
let heart = [];

let started = false;
let forming = false;

function resize(){

    W = innerWidth;
    H = innerHeight;

    canvas.width = W;
    canvas.height = H;

    createHeart();
}

window.addEventListener("resize",resize);

function random(min,max){
    return Math.random()*(max-min)+min;
}

function createParticles(){

    particles=[];

    for(let i=0;i<COUNT;i++){

        particles.push({

            x:random(0,W),
            y:random(0,H),

            vx:random(-0.4,0.4),
            vy:random(-0.4,0.4),

            size:random(0.7,2.4),

            color:
                colors[
                    Math.floor(
                        Math.random()*colors.length
                    )
                ],

            alpha:random(.4,1)

        });
    }
}

function createHeart(){

    heart=[];

    const scale=Math.min(W,H)/38;

    for(let i=0;i<COUNT;i++){

        const t=
            Math.random()*Math.PI*2;

        const fill=
            Math.sqrt(Math.random());

        const x=
            16*Math.pow(Math.sin(t),3);

        const y=
            13*Math.cos(t)
            -5*Math.cos(2*t)
            -2*Math.cos(3*t)
            -Math.cos(4*t);

        heart.push({

            x:W/2+x*scale*fill,

            y:H/2-y*scale*fill,

            size:random(.8,2.5),

            color:"#ff1744"

        });
    }
}

createParticles();
createHeart();

function drawParticle(p){

    ctx.beginPath();

    ctx.fillStyle=p.color;
    ctx.globalAlpha=p.alpha;

    ctx.shadowBlur=12;
    ctx.shadowColor=p.color;

    ctx.arc(
        p.x,
        p.y,
        p.size,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.globalAlpha=1;
    ctx.shadowBlur=0;
}

function animate(){

    requestAnimationFrame(animate);

    ctx.fillStyle="rgba(0,3,11,.18)";
    ctx.fillRect(0,0,W,H);

    particles.forEach((p,i)=>{

        if(!forming){

            p.x+=p.vx;
            p.y+=p.vy;

            if(p.x<0)p.x=W;
            if(p.x>W)p.x=0;

            if(p.y<0)p.y=H;
            if(p.y>H)p.y=0;

        }else{

            const target=heart[i];

            p.x+=(target.x-p.x)*.025;
            p.y+=(target.y-p.y)*.025;

            p.size+=(target.size-p.size)*.025;

            p.color=target.color;
            p.alpha=.9;

        }

        drawParticle(p);

    });
}

animate();

const start=
    document.getElementById("start");

const message=
    document.getElementById("message");

start.addEventListener(
    "click",
    startJourney
);

function startJourney(){

    if(started)return;

    started=true;

    start.classList.add("hide");

    setTimeout(()=>{

        forming=true;

    },3500);

    setTimeout(()=>{

        message.classList.add("show");

    },7000);
}

document.body.addEventListener(
    "click",
    function(e){

        if(
            !started &&
            e.target !== start
        ){

            startJourney();

        }

    }
);
</script>

</body>
</html>
